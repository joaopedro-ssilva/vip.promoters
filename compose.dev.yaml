# Override de desenvolvimento: docker compose -f compose.yaml -f compose.dev.yaml up -d --build
services:
  backend:
    build:
      context: ./backend
      target: dev
    image: vip-promoters-backend-dev
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --reload --reload-dir /app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads

  worker:
    image: vip-promoters-backend-dev
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: ["arq", "app.worker.WorkerSettings", "--watch", "/app/app"]
    volumes:
      - ./backend:/app
      - uploads:/data/uploads

  # Testes: docker compose -f compose.yaml -f compose.dev.yaml run --rm tests
  tests:
    image: vip-promoters-backend-dev
    profiles: ["test"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vip}:${POSTGRES_PASSWORD:-vip}@db:5432/${POSTGRES_DB:-vip}
      REDIS_URL: redis://redis:6379/0
    command: ["pytest", "-q"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
