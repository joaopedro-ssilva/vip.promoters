name: vip-promoters

# O app conecta com o PAPEL DE APLICACAO (APP_DB_USER/APP_DB_PASSWORD do .env): sem
# superusuario, sem BYPASSRLS e sem ser dono das tabelas, para o Row Level Security valer.
# O backend monta a URL do banco a partir dessas partes (nenhuma senha em URL aqui). A senha
# do dono (POSTGRES_PASSWORD) e apagada nos containers do app: so o `migrate` a recebe.
x-backend-env: &backend-env
  env_file: .env
  environment:
    DB_HOST: db
    POSTGRES_DB: ${POSTGRES_DB:-vip}
    POSTGRES_PASSWORD: ""
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migracoes + papel de aplicacao. Roda e sai; o backend so sobe depois que ele termina.
  migrate:
    build:
      context: ./backend
    image: vip-promoters-backend
    restart: "no"
    env_file: .env  # POSTGRES_PASSWORD e APP_DB_PASSWORD vem daqui
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-vip}
      POSTGRES_DB: ${POSTGRES_DB:-vip}
    command: ["python", "-m", "app.cli", "preparar-banco"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: vip-promoters-backend
    restart: unless-stopped
    <<: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

  worker:
    image: vip-promoters-backend
    restart: unless-stopped
    <<: *backend-env
    command: ["arq", "app.worker.WorkerSettings"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      # só na máquina local: em produção o acesso é pelo proxy HTTPS (ver README)
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
